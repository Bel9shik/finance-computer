name: Offline finance builds
on: workflow_dispatch
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cross-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cross-platform/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: python ../Tests/make_fixtures.py
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run desktop
      - uses: actions/upload-artifact@v4
        with:
          name: finance-${{ runner.os }}
          path: cross-platform/src-tauri/target/release/bundle
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cross-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;30.0.16248370'
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - run: npm ci
      - run: python ../Tests/make_fixtures.py
      - run: npm test
      - run: npm run android -- --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: finance-android-unsigned
          path: cross-platform/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
